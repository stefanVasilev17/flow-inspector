services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: flow_inspector
      POSTGRES_USER: flow_inspector
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local_dev_only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - flow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flow_inspector -d flow_inspector"]
      interval: 5s
      timeout: 5s
      retries: 15
  app:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SERVER_ADDRESS: 0.0.0.0
      DB_URL: jdbc:postgresql://postgres:5432/flow_inspector
      DB_USERNAME: flow_inspector
      DB_PASSWORD: ${DB_PASSWORD:-local_dev_only}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  flow_pgdata:
